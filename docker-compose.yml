services:
  veyra:
    image: ghcr.io/mayvqt/veyra:latest
    build: .
    container_name: veyra
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "3767:3767"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/config
